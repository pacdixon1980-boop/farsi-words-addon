<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Farsi Family Words</title>
<style>
  :root {
    --bg: #F7F2E7;
    --card: #FFFFFF;
    --ink: #22303C;
    --indigo: #1E3A5F;
    --turquoise: #2F8F86;
    --gold: #C79A3E;
    --brick: #A85138;
    --border: #E4DBC7;
    --muted: #7A7264;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .page {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 32px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
  }
  .eyebrow { font-size: 12px; color: var(--turquoise); margin-bottom: 2px; }
  h1 {
    font-family: Georgia, "Iowan Old Style", serif;
    font-style: italic;
    font-size: 24px;
    margin: 0;
    color: var(--indigo);
  }
  .subtitle { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .streak {
    display: flex; align-items: center; gap: 5px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; padding: 6px 12px; font-weight: 600; font-size: 14px;
    color: var(--indigo);
  }
  nav.tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  nav.tabs button {
    flex: 1; border: 1px solid var(--border); background: var(--card);
    color: var(--muted); font-size: 13px; padding: 9px 0; border-radius: 8px; cursor: pointer;
  }
  nav.tabs button.active { background: var(--indigo); border-color: var(--indigo); color: var(--bg); }
  select {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--ink); font-size: 14px; margin-bottom: 12px;
  }
  .progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .progress-track { flex: 1; height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--turquoise); }
  .progress-label { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    min-height: 190px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 24px; text-align: center; flex-direction: column; gap: 10px;
  }
  .english-word { font-family: Georgia, serif; font-size: 28px; color: var(--indigo); }
  .translit { font-family: Georgia, serif; font-style: italic; font-size: 30px; color: var(--turquoise); }
  .tap-hint { font-size: 11.5px; color: #B8AF9B; margin-top: 6px; }
  .answer-row { display: flex; gap: 8px; margin-top: 12px; }
  .answer-row button {
    flex: 1; border: none; border-radius: 10px; padding: 12px 0; color: #fff;
    font-size: 13.5px; font-weight: 600; cursor: pointer;
  }
  .btn-again { background: var(--brick); }
  .btn-good { background: var(--indigo); }
  .btn-easy { background: var(--turquoise); }
  .session-line { font-size: 11.5px; color: var(--muted); text-align: center; margin-top: 10px; }
  .form-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px;
  }
  .form-card label { display: block; font-size: 12.5px; color: var(--muted); margin: 12px 0 4px; }
  .form-card input {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
    font-size: 14px;
  }
  .form-card button.submit {
    margin-top: 16px; width: 100%; border: none; background: var(--indigo); color: var(--bg);
    padding: 12px 0; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .toast { margin-top: 10px; font-size: 12.5px; color: var(--turquoise); text-align: center; }
  .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 30px 0; }
</style>
</head>
<body>
<div class="page" id="app"></div>

<script>
const state = {
  view: "practice",
  words: [],
  categories: [],
  currentCategory: null,
  queue: [],
  flipped: false,
  sessionDone: 0,
  boxes: JSON.parse(localStorage.getItem("farsi-boxes") || "{}"),
  streak: JSON.parse(localStorage.getItem("farsi-streak") || '{"count":0,"lastDate":null,"total":0}'),
};

const MAX_BOX = 5;
const todayStr = () => new Date().toISOString().slice(0, 10);
const yesterdayStr = () => { const d = new Date(); d.setDate(d.getDate() - 1); return d.toISOString().slice(0, 10); };

async function loadWords() {
  const res = await fetch("api/words");
  state.words = await res.json();
  state.categories = [...new Set(state.words.map(w => w.category))];
  if (!state.currentCategory && state.categories.length) state.currentCategory = state.categories[0];
  buildQueue();
  render();
}

function wordsInCategory() {
  return state.words.filter(w => w.category === state.currentCategory);
}

function buildQueue() {
  const words = wordsInCategory();
  const weighted = [];
  words.forEach(w => {
    const box = state.boxes[w.id] || 1;
    const weight = Math.max(1, MAX_BOX + 1 - box);
    for (let i = 0; i < weight; i++) weighted.push(w.id);
  });
  for (let i = weighted.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [weighted[i], weighted[j]] = [weighted[j], weighted[i]];
  }
  state.queue = weighted.slice(0, 12);
  state.flipped = false;
  state.sessionDone = 0;
}

function bumpStreak() {
  const today = todayStr();
  if (state.streak.lastDate === today) {
    state.streak.total += 1;
  } else if (state.streak.lastDate === yesterdayStr()) {
    state.streak.count += 1;
    state.streak.lastDate = today;
    state.streak.total += 1;
  } else {
    state.streak.count = 1;
    state.streak.lastDate = today;
    state.streak.total += 1;
  }
  localStorage.setItem("farsi-streak", JSON.stringify(state.streak));
}

function handleAnswer(result) {
  const wordId = state.queue[0];
  const box = state.boxes[wordId] || 1;
  let nextBox = box;
  if (result === "again") nextBox = 1;
  if (result === "good") nextBox = Math.min(MAX_BOX, box + 1);
  if (result === "easy") nextBox = Math.min(MAX_BOX, box + 2);
  state.boxes[wordId] = nextBox;
  localStorage.setItem("farsi-boxes", JSON.stringify(state.boxes));
  bumpStreak();
  state.sessionDone += 1;
  state.flipped = false;
  const rest = state.queue.slice(1);
  if (result === "again") {
    const insertAt = Math.min(rest.length, 2);
    state.queue = [...rest.slice(0, insertAt), wordId, ...rest.slice(insertAt)];
  } else {
    state.queue = rest;
  }
  render();
}

async function suggestFromFarsi() {
  const farsiInput = document.getElementById("farsi-input");
  const farsi = farsiInput.value.trim();
  if (!farsi) return;
  document.getElementById("suggest-status").textContent = "Thinking…";
  const res = await fetch("api/suggest", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ farsi }),
  });
  const data = await res.json();
  const englishField = document.querySelector('input[name="english"]');
  const translitField = document.querySelector('input[name="translit"]');
  if (data.english && !englishField.dataset.edited) englishField.value = data.english;
  if (data.translit && !translitField.dataset.edited) translitField.value = data.translit;
  document.getElementById("suggest-status").textContent = "Suggestions added below — check and edit if needed.";
}

async function submitWord(e) {
  e.preventDefault();
  const form = e.target;
  const body = {
    category: form.category.value,
    english: form.english.value,
    translit: form.translit.value,
    farsi: form.farsi.value,
  };
  document.getElementById("toast").textContent = "Saving (generating audio can take a moment)…";
  const res = await fetch("api/words", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (res.ok) {
    form.reset();
    document.getElementById("toast").textContent = "Word added!";
    await loadWords();
    setTimeout(() => { const t = document.getElementById("toast"); if (t) t.textContent = ""; }, 2500);
  } else {
    document.getElementById("toast").textContent = "Couldn't save that word — try again.";
  }
}

function render() {
  const app = document.getElementById("app");
  const masteredInCat = wordsInCategory().filter(w => (state.boxes[w.id] || 1) >= MAX_BOX).length;
  const totalInCat = wordsInCategory().length;
  const currentWord = state.words.find(w => w.id === state.queue[0]);

  app.innerHTML = `
    <header>
      <div>
        <div class="eyebrow">Learn Persian</div>
        <h1>Khāne-ye Fārsi</h1>
        <div class="subtitle">a little every day, with your family</div>
      </div>
      <div class="streak">🔥 ${state.streak.count}</div>
    </header>
    <nav class="tabs">
      <button class="${state.view === "practice" ? "active" : ""}" onclick="setView('practice')">Practice</button>
      <button class="${state.view === "add" ? "active" : ""}" onclick="setView('add')">Add a word</button>
    </nav>
    ${state.view === "practice" ? renderPractice(currentWord, masteredInCat, totalInCat) : renderAddForm()}
  `;
}

function renderPractice(currentWord, masteredInCat, totalInCat) {
  if (!state.categories.length) {
    return `<div class="empty">No words yet — add the first one!</div>`;
  }
  const catOptions = state.categories.map(c =>
    `<option value="${c}" ${c === state.currentCategory ? "selected" : ""}>${c}</option>`
  ).join("");

  const cardInner = !currentWord
    ? `<div class="empty">Session complete — ${state.sessionDone} reviewed.<br/><br/>
        <button class="submit" style="width:auto;padding:10px 20px" onclick="buildQueue(); render();">Practice again</button>
      </div>`
    : !state.flipped
      ? `<div class="english-word">${currentWord.english}</div><div class="tap-hint">say it, then tap to check</div>`
      : `<div class="translit">${currentWord.translit}</div>
         ${currentWord.has_audio ? `<button class="submit" style="width:auto;padding:8px 16px;background:var(--turquoise)" onclick="event.stopPropagation(); playAudio(${currentWord.id})">🔊 Hear it</button>` : ""}`;

  return `
    <select onchange="changeCategory(this.value)">${catOptions}</select>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" style="width:${totalInCat ? (masteredInCat/totalInCat*100) : 0}%"></div></div>
      <span class="progress-label">${masteredInCat}/${totalInCat} mastered</span>
    </div>
    <div class="card" onclick="${currentWord ? 'toggleFlip()' : ''}">${cardInner}</div>
    ${currentWord && state.flipped ? `
      <div class="answer-row">
        <button class="btn-again" onclick="handleAnswer('again')">Again</button>
        <button class="btn-good" onclick="handleAnswer('good')">Good</button>
        <button class="btn-easy" onclick="handleAnswer('easy')">Easy</button>
      </div>` : ""}
    ${currentWord ? `<div class="session-line">${state.sessionDone} reviewed this session · ${state.queue.length} left</div>` : ""}
  `;
}

function renderAddForm() {
  const dataList = state.categories.map(c => `<option value="${c}">`).join("");
  return `
    <div class="form-card">
      <form onsubmit="submitWord(event)">
        <label>Category</label>
        <input name="category" list="cat-list" value="Elara" required />
        <datalist id="cat-list">${dataList}</datalist>

        <label>Farsi (type in Persian script)</label>
        <input id="farsi-input" name="farsi" dir="rtl" lang="fa" placeholder="مثلاً خوابالو" onblur="suggestFromFarsi()" />
        <div class="toast" id="suggest-status"></div>

        <label>English meaning <span style="font-weight:400">(auto-suggested, editable)</span></label>
        <input name="english" oninput="this.dataset.edited='1'" placeholder="e.g. sleepy" required />

        <label>How it sounds (romanized) <span style="font-weight:400">(auto-suggested, editable)</span></label>
        <input name="translit" oninput="this.dataset.edited='1'" placeholder="e.g. khabalood" required />

        <button class="submit" type="submit">Add word</button>
      </form>
      <div class="toast" id="toast"></div>
    </div>
  `;
}

function setView(v) { state.view = v; render(); }
function changeCategory(c) { state.currentCategory = c; buildQueue(); render(); }
function toggleFlip() { state.flipped = !state.flipped; render(); }
function playAudio(wordId) { new Audio(`audio/${wordId}.wav`).play(); }

loadWords();
</script>
</body>
</html>
